<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/searches.css">

    <title>Program Searching</title>
</head>
<body>
    <a href="index.html" class="home-button" title="Return to Home Page"><img src="assets/img/home-button.png"></a>

    <main class="search-page">
        <section class="page-header">
            <p class="eyebrow">Program Search</p>
            <h1>Find University Programs</h1>
            <p class="intro">Search by school, program, co-op availability, tuition range, or program length.</p>
        </section>

        <section class="search-panel page-panel">
            <div class="search-bar">
                <input type="text" id="txt-input" placeholder="Search for a program...">
                <button type="button" class="search-button" onclick="execSearch()" aria-label="Search programs">
                    <img src="assets/img/search-button.png">
                </button>
            </div>

            <div class="search-tabs" aria-label="Search modes">
                <button type="button" class="ghost" onclick="showPartialSearch();">Partial Search</button>
                <button type="button" class="ghost" onclick="showCoop();">Has Co-op: Yes</button>
                <button type="button" class="ghost" onclick="showLength();">Length of Program</button>
            </div>

            <div class="filter-grid">
                <div class="filter-group">
                    <input type="number" id="tt-lower-bound" placeholder="Lowerbound of Tuition">
                    <input type="number" id="tt-upper-bound" placeholder="Upperbound of Tuition">
                    <button type="button" class="secondary" onclick="swapTuitionMode();" id="btn-swap-tuition">Domestic Tuition</button>
                </div>

                <div class="filter-group">
                    <input type="number" id="program-length" placeholder="Length of Program">
                </div>
            </div>
        </section>

        <section class="results-section">
            <h2>Search Results</h2>
            <div id="p-output" class="results-grid"></div>
        </section>
    </main>
    <script type="module" src="assets/script/searches.js"></script>
</body>
</html>
