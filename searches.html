<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/searches.css">

    <title>Program Searching</title>
</head>
<body>
    <div>
        <div class="search-bar">
            <input type = "text", id = "txt-input" placeholder="Search for a program...">
            <button onclick="execSearch()"><img src="assets/img/search_button.png"></button>
            <div>
                <button onclick = "showPartialSearch();">Partial Search</button>
                <button onclick = "showCoop();">Co-op</button>
                <button onclick = "showNonCoop()">Non Co-op</button>
                <button onclick = "showLength();">Length of Program</button>
            </div>
        </div>
        <div>
            <div>
                <input type = "number", id = "tt-upper-bound" placeholder="Upperbound of Tuition">
                <input type = "number", id = "tt-lower-bound" placeholder="Lowerbound of Tuition">
            </div>
            <div>
                <button onclick = "swapTuition();" id="btn-swap-tuition">Domestic Tuition</button>
            </div>
        </div>
        <div>
            <input type = "number", id = "program-length" placeholder="Length of Program">
        </div>
        <div>
            <p id = "p-output"></p>
        </div>
    </div>
    <script type="module" src="assets/script/searches.js"></script>
</body>
</html>
